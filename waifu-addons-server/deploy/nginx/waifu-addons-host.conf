# Install in the host's nginx conf.d or sites-enabled directory.
# Use with compose.host-nginx.yaml, NOT the default Docker nginx service.
server {
    listen 4853;
    listen [::]:4853;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;

    # For public HTTPS, replace the listen directives with:
    # listen 4853 ssl;
    # listen [::]:4853 ssl;
    # ssl_certificate /etc/nginx/waifu-certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/waifu-certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:4854;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        proxy_redirect off;
    }
}
